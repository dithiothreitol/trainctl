name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the lowest version with native type stripping (see engines);
        # 24 is what most contributors will actually have installed.
        os: [ubuntu-latest, windows-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The corpus of coaching plans holds personal data and is not in the
      # repository, so the seven backtest cases skip here by design.
      - run: pnpm test
