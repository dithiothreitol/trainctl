name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the lowest version with native type stripping (see engines);
        # 24 is what most contributors will actually have installed.
        os: [ubuntu-latest, windows-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # The corpus of coaching plans holds personal data and is not in the
      # repository, so the seven backtest cases skip here by design.
      - run: pnpm test

      # The plugin's skills are generated from the AGENTS.md text; a stale copy
      # would give the agent a different coach than `trainctl init` writes.
      - run: node tools/plugin/render-skills.ts --check
      - run: pnpm simulate:multisport
      - run: pnpm benchmark:multisport

  # What the repository cannot see about itself: the published packages run from
  # node_modules, where Node refuses to strip TypeScript types. 0.1.0 shipped
  # broken because every other check runs from the source tree.
  dist:
    name: ${{ matrix.os }} · install from tarballs and run
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: install as a user would, simulate CLI and call MCP over stdio
        run: pnpm verify:distribution --online
