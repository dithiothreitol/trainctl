name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the lowest version with native type stripping (see engines);
        # 24 is what most contributors will actually have installed.
        os: [ubuntu-latest, windows-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # The corpus of coaching plans holds personal data and is not in the
      # repository, so the seven backtest cases skip here by design.
      - run: pnpm test

  # What the repository cannot see about itself: the published packages run from
  # node_modules, where Node refuses to strip TypeScript types. 0.1.0 shipped
  # broken because every other check runs from the source tree.
  dist:
    name: install from tarballs and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: pack every package
        run: |
          set -euo pipefail
          mkdir -p /tmp/tgz
          for p in core export sync-intervalsicu cli mcp; do
            (cd "packages/$p" && pnpm pack --pack-destination /tmp/tgz)
          done
          ls -1 /tmp/tgz

      - name: install as a user would and run the CLI
        run: |
          set -euo pipefail
          cd /tmp/tgz
          npm init -y > /dev/null
          npm install ./trainctl-core-*.tgz ./trainctl-export-*.tgz \
                      ./trainctl-sync-intervalsicu-*.tgz ./trainctl-mcp-*.tgz \
                      ./trainctl-[0-9]*.tgz
          ./node_modules/.bin/trainctl --version
          ./node_modules/.bin/trainctl init --template
          ./node_modules/.bin/trainctl plan --date 2026-08-08 | grep -q 'weeks of plan'
          ./node_modules/.bin/trainctl check
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | TRAINCTL_DIR=/tmp/tgz timeout 30 ./node_modules/.bin/trainctl-mcp \
            | grep -q '"serverInfo"'
